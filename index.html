<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- App shell baseline — keep aligned with src/lib/seo/site.ts (app.coldop.in) -->
    <title>Coldop</title>
    <meta
      name="description"
      content="Coldop workspace — gate passes, chamber stock, farmer ledgers, daybook, and reports for cold storage operators."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1a7a4c" />
    <meta name="application-name" content="Coldop" />
    <link rel="canonical" href="https://app.coldop.in/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coldop" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Coldop" />
    <meta
      property="og:description"
      content="Coldop workspace — gate passes, chamber stock, farmer ledgers, daybook, and reports for cold storage operators."
    />
    <meta property="og:url" content="https://app.coldop.in/" />
    <meta property="og:image" content="https://app.coldop.in/og/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Coldop" />
    <meta
      name="twitter:description"
      content="Coldop workspace — gate passes, chamber stock, farmer ledgers, daybook, and reports for cold storage operators."
    />
    <meta name="twitter:image" content="https://app.coldop.in/og/og-default.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Hydrate theme from shared .coldop.in cookie before React/next-themes boot -->
    <script>
      (function () {
        try {
          var cookieName = 'coldop-theme';
          var storageKey = 'theme';
          var match = document.cookie.match(
            new RegExp('(?:^|; )' + cookieName + '=([^;]*)'),
          );
          var cookieTheme = match ? decodeURIComponent(match[1]) : null;
          var stored = null;
          try {
            stored = localStorage.getItem(storageKey);
          } catch (e) {}
          var theme = cookieTheme || stored;
          if (
            cookieTheme &&
            cookieTheme !== stored &&
            (cookieTheme === 'light' ||
              cookieTheme === 'dark' ||
              cookieTheme === 'system')
          ) {
            try {
              localStorage.setItem(storageKey, cookieTheme);
            } catch (e) {}
            theme = cookieTheme;
          }
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark =
            theme === 'dark' || ((theme === 'system' || !theme) && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
